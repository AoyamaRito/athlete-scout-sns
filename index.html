<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Athlete Scout SNS</title>
    <style>
        body { font-family: sans-serif; background: #fafafb; margin: 0; padding: 30px; color: #1f242d; line-height: 1.6; }
        h1 { color: #1a237e; border-bottom: 1px solid #e2e5eb; padding-bottom: 15px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 30px; }
        .section { background: white; margin-bottom: 30px; padding: 30px; border: 1px solid #e2e5eb; border-radius: 0; }
        .btn { background: #1a237e; color: white; border: 1px solid #1a237e; padding: 10px 20px; border-radius: 2px; cursor: pointer; font-weight: bold; letter-spacing: 0.05em; transition: background-color 0.2s; }
        .btn:hover { background: #121858; border-color: #121858; }
        .btn-secondary { background: transparent; color: #1a237e; border: 1px solid #1a237e; }
        .btn-secondary:hover { background: #f0f2f5; }
        .user-card { border: 1px solid #e2e5eb; padding: 20px; margin: 15px 0; border-radius: 0; display: flex; justify-content: space-between; align-items: center; background: #fafafb; }
        .friend-badge { background: #eceef7; color: #1a237e; padding: 4px 10px; border-radius: 0; font-size: 0.8em; font-weight: bold; border: 1px solid #e2e5eb; }
        .billing-log { font-family: monospace; background: #fafafb; padding: 20px; font-size: 0.9em; border: 1px solid #e2e5eb; }
        .tag-value { color: #c0392b; font-weight: bold; font-family: monospace; }
    </style>
<body>
    <div class="container">
        <h1>体育会系学生スカウトSNS <span style="font-size: 0.5em; color: #65676b;">(Yume v2 プロトタイプ)</span></h1>
        
        <div id="app">
            <!-- UI はここにレンダリングされます -->
        </div>

        <div class="section">
            <h3>請求履歴（管理者用）</h3>
            <div id="billing-view" class="billing-log"></div>
        </div>
    </div>

    <script src="vendor/qrcode.min.js"></script>
    <script src="vendor/jsQR.js"></script>
    <script type="module">
        import { store, dispatch } from './logic.yume.js';
        import { render } from './ui.yume.js';

        const appEl = document.getElementById('app');
        const billingEl = document.getElementById('billing-view');

        // Observer: Re-render on state change
        function update() {
            render(appEl, store.REAL_state, dispatch);
            
            // Update billing log
            billingEl.innerHTML = store.REAL_state.billing.map(b => 
                `<div>[${b.type}] ${b.matchId} -> <span class="tag-value">${b.amount}</span></div>`
            ).join('') || 'No transactions yet.';
        }

        // Initial render
        update();

        // Hook into dispatch to trigger update (Simple observable)
        const originalDispatch = store.dispatch;
        store.dispatch = function(...args) {
            const res = originalDispatch.apply(store, args);
            if (res) update();
            return res;
        };
    </script>
</body>
</html>
